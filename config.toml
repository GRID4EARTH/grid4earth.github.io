# ── What is GRID4EARTH ────────────────────────────────────────────────────────
[extra.overview]
tag = "PROJECT OVERVIEW"
title = "One grid to bridge models and observations"
body = "Copernicus and Destination Earth produce massive global datasets on heterogeneous grids — regular lat/lon, reduced Gaussian, swath geometries, unstructured meshes. Reconciling them means ad-hoc regridding that is costly, error-prone, and not reproducible. GRID4EARTH adopts a single Discrete Global Grid System (DGGS) — the HEALPix equal-area grid, referenced to the WGS84 ellipsoid — combined with cloud-optimized Zarr V3 storage, so data from every mission shares one analysis-ready surface."

[[extra.overview.points]]
title = "Equal area at every depth"
description = "HEALPix nested is a native quadtree: each pixel subdivides into four children with identical surface area at any resolution — unbiased statistics and trivial up/downscaling."
icon = "layer-group"

[[extra.overview.points]]
title = "Ellipsoidal, not just spherical"
description = "HEALPix is defined on a sphere, but Earth is a WGS84 ellipsoid. At Copernicus resolution that 0.3% flattening matters. An authalic-sphere mapping preserves equal area on the ellipsoid."
icon = "globe"

[[extra.overview.points]]
title = "Cloud-native & AI-ready"
description = "Space-filling-curve locality maps to GPU batches and ML-friendly tiles; quadtree nodes align with Zarr / COG chunks for scalable object-store access."
icon = "cloud"

# ── DGGS / HEALPix explainer ──────────────────────────────────────────────────
[extra.dggs]
tag = "WHY A DGGS"
title = "From a fragmented grid landscape to analysis-ready data"
subtitle = "HEALPix gives climate models (on the sphere) and Earth Observation (on the ellipsoid) a single common grid — no regridding, consistent statistics, interoperable workflows."
figure_embed = "/embeds/healpix-globe.html"
figure_code = "scripts/figures/make_healpix_globe.py"
figure_caption = "The HEALPix tessellation on Earth — an equal-area quadtree (drag to rotate). The 12 base cells (red) each subdivide into four children at every depth. (Whether this is computed on a sphere or the WGS84 ellipsoid is invisible at this scale — that difference is shown below, where it matters.)"

[[extra.dggs.cards]]
title = "The problem"
description = "Every dataset lives on a different grid. Users repeat ad-hoc interpolations, lose information to aliasing and area bias, and get different results per workflow. There is no shared standard."
icon = "triangle-exclamation"

[[extra.dggs.cards]]
title = "The candidate"
description = "HEALPix — Hierarchical Equal Area isoLatitude Pixelisation. Already adopted by DestinE's Climate Digital Twin, ECMWF, Planck, WMAP and Euclid. A native quadtree with equal-area cells and iso-latitude rings."
icon = "border-all"

[[extra.dggs.cards]]
title = "The GRID4EARTH path"
description = "Ellipsoidal HEALPix via the authalic sphere: an exact, invertible, area-preserving mapping that keeps the equal-area guarantee on WGS84. Backward compatible with standard HEALPix — only the coordinate mapping changes, no new tooling."
icon = "compass-drafting"

# ── Ellipsoidal HEALPix / what healpix-geo does ────────────────────────────────
[extra.ellipsoidal]
tag = "ELLIPSOIDAL HEALPIX"
title = "How healpix-geo keeps equal area on the real Earth"
body = "HEALPix is defined on a perfect sphere — but Earth is a WGS84 ellipsoid. At Copernicus resolution that ~0.3% flattening introduces a latitude-dependent area bias of up to 0.67%, enough to break zonal statistics. <strong>healpix-geo</strong> maps the ellipsoid onto an authalic (equal-area) sphere, pixelises it with standard HEALPix, then maps back. The transform is exact, invertible to ~1 nm, and backward compatible with spherical HEALPix — only the coordinate mapping changes, so no new tooling is needed."
image = "/img/ellipsoid-authalic-healpix.png"
image_caption = "Ellipsoid → authalic sphere → HEALPix → ellipsoid pixelization. θ is the geocentric and φ the geodetic latitude (the surface normal); the authalic mapping preserves surface area, so the hierarchical, iso-latitude and equal-area properties carry over to WGS84. Figure from the healpix-geo documentation."
code_caption = "Evaluate HEALPix on the WGS84 ellipsoid — one keyword. The sphere-vs-WGS84 comparison below is produced by this same library."
code_url = "https://github.com/GRID4EARTH/grid4earth.github.io/blob/main/scripts/figures/make_dggs_figures.py"
code_path = "scripts/figures/make_dggs_figures.py"
results_title = "Why the reference surface matters"

[[extra.ellipsoidal.results]]
image = "/img/healpix-sphere-vs-ellipsoid.png"
code = "scripts/figures/snippets/healpix-sphere-vs-ellipsoid.py"
caption = "At fine resolution (depth 10 ≈ 3 arcmin cells), spherical vs WGS84 HEALPix put a latitude-dependent share of points in a different cell — near zero at the equator and poles, but most points at mid-latitudes. Ignoring the ellipsoid bakes this bias into Copernicus-resolution analysis. Generated with healpix-geo."

[[extra.ellipsoidal.results]]
image = "/img/healpix-resample-demo.png"
code = "scripts/figures/snippets/healpix-resample-demo.py"
caption = "A continuous field on a regular lon/lat grid (left) aggregated onto equal-area HEALPix cells (right). Note how cells widen in longitude toward the poles — that is the equal-area tessellation, where lon/lat grids instead shrink. Generated with healpix-geo."

# ── Tools section header ───────────────────────────────────────────────────────
# Cards below link straight to each tool's own documentation — we don't duplicate
# the docs here. To add a tool: copy an [[extra.tools_section.items]] block.
[extra.tools_section]
tag = "OPEN-SOURCE TOOLS"
title = "The HEALPix tool family"
subtitle = "A coherent open-source stack — built by GRID4EARTH — to index, resample, analyse and plot Earth data on the HEALPix grid. All free, on PyPI / conda-forge, with WGS84 ellipsoidal support."

[[extra.tools_section.items]]
name = "grid4earth"
tagline = "The meta-package — “pip install grid4earth” installs the whole stack at once: healpix-geo, -resample, -analyse and -plot."
icon = "boxes-stacked"
doc_url = "https://github.com/GRID4EARTH/packages"
pypi_url = "https://pypi.org/project/grid4earth/"

[[extra.tools_section.items]]
name = "healpix-geo"
tagline = "Core HEALPix coordinate algorithms for the geosciences, on the WGS84 ellipsoid. The foundation the rest of the stack builds on."
icon = "earth-europe"
doc_url = "https://healpix-geo.readthedocs.io/"
repo_url = "https://github.com/GRID4EARTH/healpix-geo"
pypi_url = "https://pypi.org/project/healpix-geo/"
conda_url = "https://anaconda.org/conda-forge/healpix-geo"

[[extra.tools_section.items]]
