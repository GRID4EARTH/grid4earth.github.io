tagline = "Regrid (lon, lat) data onto a HEALPix grid with GPU-accelerated sparse operators — nearest-neighbour and PSF interpolation."
icon = "arrows-to-dot"
doc_url = "https://grid4earth.github.io/healpix-resample/"
repo_url = "https://github.com/GRID4EARTH/healpix-resample"
pypi_url = "https://pypi.org/project/healpix-resample/"

[[extra.tools_section.items]]
